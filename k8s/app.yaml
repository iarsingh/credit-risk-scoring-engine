apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk-scoring-engine
  labels:
    app: credit-risk-scoring-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-risk-scoring-engine
  template:
    metadata:
      labels:
        app: credit-risk-scoring-engine
    spec:
      containers:
        - name: api
          image: credit-risk-scoring-engine:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: credit-risk-scoring-engine
spec:
  selector:
    app: credit-risk-scoring-engine
  ports:
    - port: 80
      targetPort: 8080
